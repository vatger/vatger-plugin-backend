services:
  backend:
    image: ghcr.io/vatger/vatger-plugin-backend:latest
    container_name: vatger-plugin-api
    restart: unless-stopped
    environment:
      POSTGRES_DB_URL:
      POSTGRES_DB_ECHO:
      REDIS_URL: redis://redis:6379/0
      DATAFEED_URL:
      PUBLIC_URL:
      JWT_SECRET_KEY:
      VATSIM_AUTH_URL:
      VATSIM_CLIENT_ID:
      VATSIM_CLIENT_SECRET:
      VATSIM_REDIRECT_URL:
      SILENT_REQUEST_ALLOWED_AIRPORTS:
      GDPR_API_TOKEN:
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "
      alembic upgrade head &&
      uvicorn api.app:app --host 0.0.0.0 --port 8000 --app-dir src"

  db:
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_USER:
      POSTGRES_PASSWORD:
      POSTGRES_DB:
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
      interval: 10s
      timeout: 3s
      retries: 5

  worker:
    image: ghcr.io/vatger/vatger-plugin-backend:latest
    container_name: vatger-plugin-worker
    restart: unless-stopped
    command: taskiq worker app.tkq:broker app.tasks
    environment:
      REDIS_URL: redis://redis:6379/0
      DATAFEED_URL:
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  scheduler:
    image: ghcr.io/vatger/vatger-plugin-backend:latest
    container_name: vatger-plugin-scheduler
    restart: unless-stopped
    command: taskiq scheduler app.broker:scheduler
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy

  redis:
    container_name: vatger-plugin-redis
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  frontend:
    image: ghcr.io/vatger/vatger-plugin-frontend:latest
    container_name: vatger-plugin-frontend
    ports:
      - "8022:80"
    depends_on:
      - backend
  
volumes:
  postgres_data: